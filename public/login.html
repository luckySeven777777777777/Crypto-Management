<script>
  let loginAdminId = null;

  document.getElementById('loginBtn').onclick = async () => {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const twofaCode = document.getElementById('twofaCode').value.trim();
    const err = document.getElementById('error');

    // 2FA 验证阶段
    if (loginAdminId) {
      if (!twofaCode) {
        err.innerText = '请输入6位验证码';
        err.style.display = 'block';
        return;
      }
      try {
        const res = await fetch('/api/admin/login-2fa', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ adminId: loginAdminId, code: twofaCode })
        });
        const data = await res.json();
        if (data.ok && data.token) {
          localStorage.setItem('nexbit_admin_token', data.token);
          localStorage.setItem('admin_user', data.nickname || username);
          location.href = 'dashboard-brand.html';
        } else {
          err.innerText = data.error || '验证码错误';
          err.style.display = 'block';
        }
      } catch (e) {
        err.innerText = '服务器连接失败';
        err.style.display = 'block';
      }
      return;
    }

    // 账号密码登录阶段
    if (!username || !password) {
      err.innerText = '请输入用户名和密码';
      err.style.display = 'block';
      return;
    }

    try {
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: username, password })
      });
      const data = await res.json();
      if (data.require2FA) {
        // 进入2FA验证阶段
        loginAdminId = data.adminId;
        document.getElementById('username').disabled = true;
        document.getElementById('password').disabled = true;
        document.getElementById('twofaCode').style.display = 'block';
        document.getElementById('twofaLabel').style.display = 'block';
        document.getElementById('loginBtn').innerText = '验证';
        err.innerText = '该账号已绑定Google验证器，请输入6位验证码';
        err.style.color = '#ffa726';
        err.style.display = 'block';
      } else if (data.ok) {
        localStorage.setItem('nexbit_admin_token', data.token);
        localStorage.setItem('admin_user', data.nickname || username);
        location.href = 'dashboard-brand.html';
      } else {
        err.innerText = data.error || '登录失败';
        err.style.display = 'block';
      }
    } catch (e) {
      err.innerText = '服务器连接失败';
      err.style.display = 'block';
    }
  };
</script>

<script>
(function(){
  const c = document.getElementById('bgCanvas');
  const ctx = c.getContext('2d');
  let w, h, mouseX = -9999, mouseY = -9999;
  const particles = [];
  const PARTICLE_COUNT = 80;
  const CONN_DIST = 140;
  const MOUSE_RANGE = 180;

  function resize() {
    w = c.width = window.innerWidth;
    h = c.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  document.addEventListener('mousemove', e => {
    mouseX = e.clientX;
    mouseY = e.clientY;
  });
  document.addEventListener('mouseleave', () => {
    mouseX = -9999;
    mouseY = -9999;
  });

  class Particle {
    constructor() {
      this.reset();
    }
    reset() {
      this.x = Math.random() * w;
      this.y = Math.random() * h;
      this.vx = (Math.random() - 0.5) * 0.6;
      this.vy = (Math.random() - 0.5) * 0.6;
      this.r = Math.random() * 2.5 + 1;
      this.alpha = Math.random() * 0.6 + 0.2;
    }
    update() {
      const dx = mouseX - this.x;
      const dy = mouseY - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < MOUSE_RANGE && mouseX > 0) {
        const force = (MOUSE_RANGE - dist) / MOUSE_RANGE;
        this.vx += (dx / dist) * force * 0.08;
        this.vy += (dy / dist) * force * 0.08;
      }
      this.vx *= 0.98;
      this.vy *= 0.98;
      this.x += this.vx;
      this.y += this.vy;
      if (this.x < -20) this.x = w + 20;
      if (this.x > w + 20) this.x = -20;
      if (this.y < -20) this.y = h + 20;
      if (this.y > h + 20) this.y = -20;
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      const glow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r * 3);
      glow.addColorStop(0, `rgba(100,180,255,${this.alpha})`);
      glow.addColorStop(0.5, `rgba(60,140,240,${this.alpha * 0.4})`);
      glow.addColorStop(1, 'rgba(60,140,240,0)');
      ctx.fillStyle = glow;
      ctx.fill();
    }
  }

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push(new Particle());
  }

  function drawConnections() {
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const p1 = particles[i], p2 = particles[j];
        const dx = p1.x - p2.x, dy = p1.y - p2.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < CONN_DIST) {
          const alpha = (1 - dist / CONN_DIST) * 0.25;
          ctx.strokeStyle = `rgba(80,160,255,${alpha})`;
          ctx.lineWidth = 0.6;
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }
      }
    }
  }

  function animate() {
    ctx.clearRect(0, 0, w, h);
    drawConnections();
    for (const p of particles) {
      p.update();
      p.draw();
    }
    requestAnimationFrame(animate);
  }
  animate();
})();
</script>
