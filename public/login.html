<!DOCTYPE html>

<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXBIT 管理后台登录</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-box {
      width: 360px;
      background: rgba(0,0,0,0.65);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    .logo {
      text-align: center;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }
    .sub {
      text-align: center;
      font-size: 13px;
      color: #9aa4ad;
      margin-bottom: 28px;
    }
    label {
      font-size: 13px;
      color: #cfd8dc;
      display: block;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      outline: none;
      background: #111;
      color: #fff;
      margin-bottom: 18px;
      font-size: 14px;
    }
    input::placeholder { color: #666; }
    button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #1e88e5, #1565c0);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    .error {
      margin-top: 12px;
      font-size: 13px;
      color: #ff5252;
      text-align: center;
      display: none;
    }
    .footer {
      margin-top: 26px;
      font-size: 11px;
      text-align: center;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="logo">NEXBIT ADMIN</div>
    <div class="sub">Management Control Panel</div>

```
<label>用户名</label>
<input id="username" placeholder="Admin / Agent" />

<label>密码</label>
<input id="password" type="password" placeholder="••••••••" />

<div id="twofaBox" style="display:none;margin-bottom:16px">
    <div style="font-size:12px;color:#ffbb33;margin-bottom:6px">该账号已绑定Google验证器，请输入6位验证码</div>
    <input id="twofaCode" placeholder="6位验证码" style="margin-bottom:10px" />
    <button id="twofaBtn" style="background:linear-gradient(135deg, #f59e0b, #d97706)">验证登录</button>
  </div>

<button id="loginBtn">登录</button>

<div id="error" class="error">登录失败</div>

<div class="footer">© NEXBIT System</div>
```

  </div>

<script>
  let _2faAdminId = '';

  document.getElementById('loginBtn').onclick = async () => {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const err = document.getElementById('error');

    if (!username || !password) {
      err.innerText = '请输入用户名和密码';
      err.style.display = 'block';
      return;
    }

    try {
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: username, password })
      });

      const data = await res.json();

      if (data.ok && data.token) {
        localStorage.setItem('nexbit_admin_token', data.token);
        localStorage.setItem('nexbit_admin_name', data.nickname || username);
        localStorage.setItem('nexbit_admin_id', username);
        if (data.permissions) localStorage.setItem('nexbit_admin_perms', JSON.stringify(data.permissions));
        localStorage.setItem('nexbit_admin_super', data.isSuper ? '1' : '0');
        if (data.platform_id) localStorage.setItem('nexbit_admin_platform', data.platform_id);
        location.href = 'dashboard-brand.html';
      } else if (data.ok && data.require2FA) {
        _2faAdminId = data.adminId;
        document.getElementById('username').disabled = true;
        document.getElementById('password').disabled = true;
        document.getElementById('loginBtn').style.display = 'none';
        document.getElementById('twofaBox').style.display = 'block';
        err.style.display = 'none';
      } else {
        err.innerText = data.error || '登录失败';
        err.style.display = 'block';
      }
    } catch (e) {
      err.innerText = '服务器连接失败';
      err.style.display = 'block';
    }
  };

  document.getElementById('twofaBtn').onclick = async () => {
    const code = document.getElementById('twofaCode').value.trim();
    const err = document.getElementById('error');
    if (!code) { err.innerText = '请输入验证码'; err.style.display = 'block'; return; }

    try {
      const res = await fetch('/api/admin/login-2fa', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ adminId: _2faAdminId, code })
      });
      const data = await res.json();
      if (data.ok) {
        localStorage.setItem('nexbit_admin_token', data.token);
        localStorage.setItem('nexbit_admin_name', data.nickname || _2faAdminId);
        localStorage.setItem('nexbit_admin_id', _2faAdminId);
        if (data.permissions) localStorage.setItem('nexbit_admin_perms', JSON.stringify(data.permissions));
        localStorage.setItem('nexbit_admin_super', data.isSuper ? '1' : '0');
        if (data.platform_id) localStorage.setItem('nexbit_admin_platform', data.platform_id);
        location.href = 'dashboard-brand.html';
      } else {
        err.innerText = data.error || '验证码错误';
        err.style.display = 'block';
      }
    } catch (e) {
      err.innerText = '服务器连接失败';
      err.style.display = 'block';
    }
  };
</script>

</body>
</html>
